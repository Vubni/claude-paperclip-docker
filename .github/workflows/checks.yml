name: Workspace checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Validate entry points and Compose files
        shell: bash
        run: |
          git ls-files -z '*.sh' '*.command' | xargs -0 -n1 bash -n
          for app in "Claude Workspace" "Paperclip Workspace" "Paperclip Browser"; do
            BETTER_AUTH_SECRET=test-fixture PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=test-fixture \
              docker compose -f "$app.source/Contents/Resources/compose.yaml" config --quiet
          done
      - name: Docker isolation
        run: |
          docker pull python:3.12-slim-bookworm
          python3 -B tests/docker_isolation.py
